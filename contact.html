<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Contact | Eric</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Eric Michael Martin</a>
  </header>
  <div class="site-role">Design System Architect</div>

  <main>
    <section class="contact-section" style="min-height: 100vh;" aria-labelledby="contact-page-title">
      <div class="section-content"><span class="eyebrow">Start a conversation</span><h1 id="contact-page-title" class="display">Let’s make it useful.</h1><p>Tell me what you’re building, where it feels stuck, and what better could look like.</p></div>
      <form class="contact-form" data-contact-form><label for="name">Name<input id="name" name="name" type="text" required></label><label for="email">Email<input id="email" name="email" type="email" required></label><label for="message">What are you working on?<textarea id="message" name="message" required></textarea></label><button class="submit-button" type="submit">Send inquiry &rarr;</button><p class="form-status" role="status" aria-live="polite"></p></form>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
